<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <header class="header-container">
        <div class="header-left">
            <div id="date-display" class="date-text">Loading Date...</div>
            <div class="clock-container">
                <div class="clock" id="clockDisplay">00:00:00</div>
                <select class="timezone-select" id="timezoneSelection">
                    <option value="America/Los_Angeles">Pacific Time</option>
                    <option value="America/Denver">Mountain Time</option>
                    <option value="America/Chicago">Central Time</option>
                    <option value="America/New_York">Eastern Time</option>
                    <option value="Europe/London">GMT / London</option>
                </select>
            </div>
        </div>
        <div class="header-right">
            <div id="weather-display">Loading forecast...</div>
        </div>
    </header>

    <main class="content">
        <section class="forecast-section" id="weather-forecast">
            <div class="forecast-loading">Loading forecast...</div>
        </section>

        <section class="feed-section">
            <div class="feed-container">
                <h2 class="feed-title">News</h2>
                <div class="feed-track" id="newsFeed">
                    <div class="feed-item">Loading Headlines...</div>
                </div>
            </div>
        </section>

        <section class="feed-section">
            <div class="feed-container">
                <h2 class="feed-title">Market</h2>
                <div class="feed-track" id="marketFeed">
                    <span class="feed-placeholder">RSS Feed Here (Fixed Market)</span>
                </div>
            </div>
        </section>

        <section class="feed-section">
            <div class="feed-container">
                <h2 class="feed-title">Custom</h2>
                <div class="feed-track" id="customFeed">
                    <span class="feed-placeholder">RSS Feed Here (Variable Feed)</span>
                </div>
            </div>
        </section>
    </main>

    <script src="sign.js"></script>
    <script src="weather.js"></script>
</body>
</html>
