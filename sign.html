<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sign.css">
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="grid-bg" aria-hidden="true"></div>

    <main>
        <div class="top-row">
            <div class="time-card">
                <div class="card-corners" aria-hidden="true"></div>
                <div id="date-display" class="dateText">Loading Date...</div>
                <div class="clock" id="clockDisplay">00:00:00</div>
                <select class="timezone-select" id="timezoneSelection">
                    <option value="America/Los_Angeles">Pacific Time</option>
                    <option value="America/Denver">Mountain Time</option>
                    <option value="America/Chicago">Central Time</option>
                    <option value="America/New_York">Eastern Time</option>
                    <option value="Europe/London">GMT / London</option>
                </select>
            </div>
            <div class="forecast" id="weather-forecast">
                <div class="card-corners" aria-hidden="true"></div>
                <div class="forecast-loading">Loading weather…</div>
            </div>
        </div>

        <div class="content">
            <div class="ticker-wrapper-news">
                <div class="card-corners" aria-hidden="true"></div>
                <h2 class="section-title">News</h2>
                <div class="ticker-track" id="newsFeed">
                    <div class="ticker-item">Loading headlines…</div>
                </div>
            </div>

            <div class="ticker-wrapper-market">
                <div class="card-corners" aria-hidden="true"></div>
                <h2 class="section-title">Markets</h2>
                <div class="ticker-track" id="marketFeed">
                    <div class="ticker-item">Loading market feed…</div>
                </div>
            </div>

            <div class="ticker-wrapper-custom">
                <div class="card-corners" aria-hidden="true"></div>
                <h2 class="section-title">Featured</h2>
                <div class="custom-input-row">
                    <input type="url" id="customRssUrl" placeholder="Enter RSS feed URL..." class="custom-rss-input">
                    <button id="loadCustomFeed" class="custom-rss-btn">Load</button>
                </div>
                <div class="ticker-track" id="customFeed">
                    <div class="ticker-item">Enter a URL above to display custom content</div>
                </div>
            </div>
        </div>
    </main>

    <script src="sign.js"></script>
    <script src="weather.js"></script>
</body>
</html>
